[project]
name = "persian-deal-analyzer"
version = "1.0.0"
description = "MCP Server for Persian Deal Analysis with Sentiment Insights and Web Interface"
authors = [
    {name = "Persian Deal Analyzer Team", email = "admin@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    # Core database dependencies
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0", 
    "pandas>=2.0.0",
    
    # Configuration management
    "python-dotenv>=1.0.0",
    
    # MCP server
    "mcp>=1.0.0",
    
    # Web interface
    "gradio>=4.0.0",
    "plotly>=5.15.0",
    
    # Sentiment analysis and ML
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    
    # SSH and networking
    "paramiko>=3.0.0",
    
    # Utilities
    "python-dateutil>=2.8.0",
    
    # Persian text processing
    "hazm>=0.7.0",
    
    # Data processing
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    
    # Async support
    "asyncio-mqtt>=0.13.0",
    "aiofiles>=23.0.0",
    
    # For nested asyncio in Gradio
    "nest-asyncio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "gunicorn>=21.0.0",
]

monitoring = [
    "prometheus-client>=0.17.0",
    "structlog>=23.0.0",
]

[project.scripts]
persian-deal-analyzer = "main:main"
pda-web = "gradio_main:main" 
pda-mcp = "mcp.server:main"
