[pytest]
# ============================================================================
# PYTEST CONFIGURATION FILE
# ============================================================================
# Location: /project/pytest.ini (at root level, same directory as setup.py)
# Purpose: Configure pytest test discovery, markers, plugins, and output
# ============================================================================

# ============================================================================
# TEST DISCOVERY
# ============================================================================
# Where to find tests
testpaths = tests

# Test file naming patterns
python_files = test_*.py verify_*.py
python_classes = Test*
python_functions = test_* verify_*

# ============================================================================
# MARKERS - Test categorization
# ============================================================================
# Usage: @pytest.mark.marker_name on test functions
# Run specific markers: pytest -m marker_name

markers =
    unit: Unit tests (fast, mocked, no dependencies)
    integration: Integration tests (slower, uses real components)
    smoke: Smoke tests (quick verification scripts)
    slow: Slow running tests (>5 seconds)
    requires_db: Tests that require database connection
    requires_redis: Tests that require Redis
    requires_chromadb: Tests that require ChromaDB
    requires_gpu: Tests that require GPU
    asyncio: Async/await tests
    flaky: Tests that are known to be flaky/unreliable

# ============================================================================
# PLUGINS & EXTENSIONS
# ============================================================================
# Automatically use these plugins (CORE OPTIONS ONLY - no optional plugins)
addopts =
    # Verbose output
    -v
    
    # Show local variables in tracebacks
    --tb=short
    
    # Show summary of test results
    --strict-markers
    
    # Show slowest tests
    --durations=10
    
    # Asyncio mode (if pytest-asyncio installed)
    --asyncio-mode=auto

# ============================================================================
# COVERAGE CONFIGURATION (install with: pip install pytest-cov)
# ============================================================================
# These options are automatically used when pytest-cov is installed
# If not installed, you can still run: pytest tests/ --cov=. --cov-report=html

[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    setup.py

branch = True
parallel = False

# ============================================================================
# REPORT SETTINGS
# ============================================================================

[coverage:report]
ignore_errors = False

omit =
    */tests/*
    */venv/*
    */site-packages/*
    setup.py

# Minimum coverage percentage required to pass
fail_under = 70

# Precision for coverage percentages (decimal places)
precision = 2

# Show lines not covered
show_missing = True

# Skip covered files in output
skip_covered = False

# Skip empty files
skip_empty = True

# Sort report by coverage percentage
sort = Cover

# Exclude specific lines from coverage
exclude_lines =
    # Standard pragma (don't cover this line)
    pragma: no cover
    
    # Debugging code
    def __repr__
    raise AssertionError
    raise NotImplementedError
    
    # Code that's only executed in certain conditions
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    
    # Abstract methods
    @abc.abstractmethod
    @abstractmethod
    
    # Conditional imports
    except ImportError:
    except ModuleNotFoundError:
    
    # Defensive programming
    if 0:
    if False:
    
    # Logging/debug statements
    logger.
    log.
    
    # Type checking
    @overload
    
    # Protocol definitions
    @runtime_checkable
    
    # Async patterns
    async def
    await
    
    # Error handlers in main
    if sys.version_info
    
    # Django/Flask specific
    def ready\(self\):

# ============================================================================
# HTML REPORT
# ============================================================================

[coverage:html]
directory = htmlcov
title = Code Coverage Report - Persian Deal Analyzer
show_contexts = True

# ============================================================================
# XML REPORT (for CI/CD integration)
# ============================================================================

[coverage:xml]
output = coverage.xml
package_depth = 2

# ============================================================================
# JSON REPORT (for programmatic access)
# ============================================================================

[coverage:json]
output = coverage.json
pretty_print = True
show_contexts = True

# ============================================================================
# COVERAGE PATHS
# ============================================================================
[coverage:paths]
source =
    database/
    models/
    services/
    utils/
    config/
    ./database/
    ./models/
    ./services/
    ./utils/
    ./config/

# ============================================================================
# OUTPUT & LOGGING
# ============================================================================
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
console_output_style = progress

# ============================================================================
# IGNORE & COLLECT PATTERNS
# ============================================================================
norecursedirs = 
    .git
    .venv
    venv
    .env
    __pycache__
    *.egg-info
    .pytest_cache
    node_modules
    .tox

# ============================================================================
# USEFUL PYTEST COMMANDS
# ============================================================================
#
# Run all tests
#   pytest tests/
#
# Run only unit tests
#   pytest tests/unit/ -v
#
# Run only integration tests
#   pytest tests/integration/ -v
#
# Run only fast tests (exclude slow)
#   pytest tests/ -m "not slow" -v
#
# Run only tests requiring database
#   pytest tests/ -m requires_db -v
#
# Run with coverage (requires pytest-cov)
#   pytest tests/ --cov=. --cov-report=html --cov-report=term-missing
#
# Run and stop on first failure
#   pytest tests/ -x
#
# Run parallel tests (requires pytest-xdist)
#   pytest tests/ -n auto
#
# Run specific test file
#   pytest tests/unit/test_database.py -v
#
# Run specific test function
#   pytest tests/unit/test_database.py::TestClass::test_function -v
#
# List all tests without running
#   pytest tests/ --collect-only
#
# ============================================================================
# INSTALLING OPTIONAL PLUGINS
# ============================================================================
#
# For coverage reports:
#   pip install pytest-cov
#
# For parallel execution:
#   pip install pytest-xdist
#
# For async tests:
#   pip install pytest-asyncio
#
# For timeout handling:
#   pip install pytest-timeout
#
# Install all recommended:
#   pip install pytest-cov pytest-xdist pytest-asyncio pytest-timeout
#
# ============================================================================
